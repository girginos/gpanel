# bot.girginos.io → destek-hub (127.0.0.1:8470). ÖRNEK; Cloudflare proxy (turuncu bulut) arkasında.
# Cloudflare IP listesi değişebilir: kurulumda https://www.cloudflare.com/ips/ ile karşılaştırın.

# --- Cloudflare'den gerçek istemci IP'si ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $destek_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=destek_ajan:10m rate=30r/m;
# gonder: yoklamada her ajan→merkez zarfı ayrı POST; yeniden bağlanış senkronu (kodlar,
# bağlantı durumları, son iptaller) kısa sürede onlarcasını üretir — 429 oturumu düşürür.
limit_req_zone $binary_remote_addr zone=destek_ajan_gonder:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=destek_tg:10m rate=600r/m;

upstream destek_hub {
    server 127.0.0.1:8470;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 off;                       # WebSocket yükseltmesi HTTP/1.1 ister
    server_name bot.girginos.io;

    # Cloudflare Origin CA sertifikası (Full (strict))
    ssl_certificate     /etc/ssl/girginos-destek/origin.pem;
    ssl_certificate_key /etc/ssl/girginos-destek/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # İsteğe bağlı: yalnız Cloudflare'den gelen bağlantılar (Authenticated Origin Pulls önerilir)
    # ssl_client_certificate /etc/ssl/girginos-destek/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    access_log /var/log/nginx/bot.girginos.io.access.log;
    error_log  /var/log/nginx/bot.girginos.io.error.log warn;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;

    # Telegram webhook (gizli başlığı servis doğrular)
    location = /v1/telegram/webhook {
        limit_req zone=destek_tg burst=100 nodelay;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_pass http://destek_hub;
    }

    # Ajan WSS (kalp atışı 20 sn; 75 sn sessizlikte kapanır)
    location = /v1/ajan/ws {
        limit_req zone=destek_ajan burst=10 nodelay;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $destek_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_pass http://destek_hub;
    }

    # Uzun yoklama yedeği (al ucu 25 sn bekler)
    location ~ ^/v1/ajan/(kayit|yanit)$ {
        limit_req zone=destek_ajan burst=20 nodelay;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_pass http://destek_hub;
    }
    location = /v1/ajan/gonder {
        limit_req zone=destek_ajan_gonder burst=300 nodelay;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_pass http://destek_hub;
    }
    location = /v1/ajan/al {
        proxy_set_header Connection "";
        proxy_read_timeout 40s;
        proxy_pass http://destek_hub;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.girginos.io;
    return 301 https://$host$request_uri;
}
